      <rect x="313" y="180" width="10" height="48" fill="#FF334B" rx="1.5"/>
      <line x1="336" y1="195" x2="336" y2="265" stroke="#FF334B" stroke-width="2.5"/>
      <rect x="331" y="206" width="10" height="42" fill="#FF334B" rx="1.5"/>
      <line x1="354" y1="215" x2="354" y2="285" stroke="#FF334B" stroke-width="2.5"/>
      <rect x="349" y="228" width="10" height="38" fill="#FF334B" rx="1.5"/>
