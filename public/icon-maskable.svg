    <!-- T Letter -->
    <path d="M 132 96 L 256 96 L 256 148 L 222 148 L 222 152 L 152 152 L 132 96 Z" fill="#00E676"/>
    <path d="M 256 96 L 380 96 L 360 152 L 290 152 L 290 148 L 256 148 Z" fill="#2a3036"/>
