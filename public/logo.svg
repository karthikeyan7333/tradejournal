<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14181c"/>
      <stop offset="60%" stop-color="#0c0e11"/>
      <stop offset="100%" stop-color="#060709"/>
    </radialGradient>

    <!-- Edge Glow Gradient (Green top-left to Red bottom-right) -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00E676" stop-opacity="0.1"/>
      <stop offset="65%" stop-color="#FF334B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF334B" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Neon Green Gradients for T -->
    <linearGradient id="greenBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2bfb8d"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00aa4e"/>
    </linearGradient>

    <linearGradient id="greenVertical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05c860"/>
      <stop offset="70%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#008f3d"/>
    </linearGradient>

    <!-- Gunmetal / Dark Metallic Gradients for right half of T -->
    <linearGradient id="metalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c434b"/>
      <stop offset="50%" stop-color="#2a3036"/>
      <stop offset="100%" stop-color="#181c20"/>
    </linearGradient>

    <linearGradient id="metalStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24292f"/>
      <stop offset="50%" stop-color="#323942"/>
      <stop offset="100%" stop-color="#1a1e22"/>
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#edgeGlow)" stroke-width="4"/>

  <!-- Candlesticks in Background -->
  <!-- Left Side: Ascending Green Candlesticks -->
  <g opacity="0.85">
    <!-- Candle 1 -->
    <line x1="140" y1="230" x2="140" y2="285" stroke="#00E676" stroke-width="2.5"/>
    <rect x="135" y="248" width="10" height="26" fill="#00E676" rx="1.5"/>

    <!-- Candle 2 -->
    <line x1="158" y1="205" x2="158" y2="270" stroke="#00E676" stroke-width="2.5"/>
    <rect x="153" y="220" width="10" height="34" fill="#00E676" rx="1.5"/>

    <!-- Candle 3 -->
    <line x1="176" y1="180" x2="176" y2="250" stroke="#00E676" stroke-width="2.5"/>
    <rect x="171" y="196" width="10" height="38" fill="#00E676" rx="1.5"/>

    <!-- Candle 4 -->
    <line x1="194" y1="160" x2="194" y2="235" stroke="#00E676" stroke-width="2.5"/>
    <rect x="189" y="172" width="10" height="46" fill="#00E676" rx="1.5"/>

    <!-- Candle 5 -->
    <line x1="212" y1="135" x2="212" y2="215" stroke="#00E676" stroke-width="2.5"/>
    <rect x="207" y="148" width="10" height="50" fill="#00E676" rx="1.5"/>
  </g>

  <!-- Right Side: Descending Red Candlesticks -->
  <g opacity="0.85">
    <!-- Candle 1 -->
    <line x1="300" y1="150" x2="300" y2="225" stroke="#FF334B" stroke-width="2.5"/>
    <rect x="295" y="162" width="10" height="42" fill="#FF334B" rx="1.5"/>

    <!-- Candle 2 -->
    <line x1="318" y1="168" x2="318" y2="245" stroke="#FF334B" stroke-width="2.5"/>
    <rect x="313" y="180" width="10" height="48" fill="#FF334B" rx="1.5"/>

    <!-- Candle 3 -->
    <line x1="336" y1="195" x2="336" y2="265" stroke="#FF334B" stroke-width="2.5"/>
    <rect x="331" y="206" width="10" height="42" fill="#FF334B" rx="1.5"/>

    <!-- Candle 4 -->
    <line x1="354" y1="215" x2="354" y2="285" stroke="#FF334B" stroke-width="2.5"/>
    <rect x="349" y="228" width="10" height="38" fill="#FF334B" rx="1.5"/>

    <!-- Candle 5 -->
    <line x1="372" y1="240" x2="372" y2="305" stroke="#FF334B" stroke-width="2.5"/>
    <rect x="367" y="252" width="10" height="32" fill="#FF334B" rx="1.5"/>
  </g>

  <!-- 3D Beveled "T" Symbol -->
  <g filter="url(#dropShadow)">
    <!-- TOP BAR - LEFT (Green) -->
    <path d="M 132 96 L 256 96 L 256 148 L 222 148 L 222 152 L 152 152 L 132 96 Z" fill="url(#greenBevel)"/>
    <!-- Green 3D Top Chamfer / Highlight -->
    <polygon points="132,96 156,86 256,86 256,96" fill="#3efd9a" opacity="0.8"/>

    <!-- TOP BAR - RIGHT (Gunmetal) -->
    <path d="M 256 96 L 380 96 L 360 152 L 290 152 L 290 148 L 256 148 Z" fill="url(#metalTop)"/>
    <polygon points="256,86 356,86 380,96 256,96" fill="#525b65" opacity="0.6"/>

    <!-- STEM - LEFT (Green with bevel) -->
    <path d="M 222 150 L 256 150 L 256 338 L 222 316 Z" fill="url(#greenVertical)"/>
    <path d="M 222 150 L 230 162 L 230 306 L 222 316 Z" fill="#20e271" opacity="0.6"/>

    <!-- STEM - RIGHT (Gunmetal with metallic edge) -->
    <path d="M 256 150 L 290 150 L 290 316 L 256 338 Z" fill="url(#metalStem)"/>
    <path d="M 280 162 L 290 150 L 290 316 L 280 306 Z" fill="#464e57" opacity="0.7"/>

    <!-- T-Intersection Center Joint Shadow Line -->
    <line x1="256" y1="86" x2="256" y2="338" stroke="#000000" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Dynamic Sweeping Green Arrow cutting across -->
  <g filter="url(#glowGreen)">
    <!-- Curved Path -->
    <path d="M 120 310 Q 235 240 376 130" fill="none" stroke="#00E676" stroke-width="8" stroke-linecap="round"/>
    <path d="M 120 310 Q 235 240 376 130" fill="none" stroke="#69f5ab" stroke-width="3" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="388,118 358,128 376,144" fill="#00E676"/>
    <polygon points="388,118 365,126 376,140" fill="#a4ffce"/>
  </g>

  <!-- Typography: TRADE (White) + JOURNAL (Green) -->
  <g id="brand-text">
    <text x="256" y="394" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="4">
      <tspan fill="#FFFFFF">TRADE</tspan><tspan fill="#00E676">JOURNAL</tspan>
    </text>
  </g>

  <!-- Underline Accent Bar -->
  <g opacity="0.8">
    <line x1="168" y1="416" x2="216" y2="416" stroke="#2d333b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="226" y1="416" x2="286" y2="416" stroke="#00E676" stroke-width="3" stroke-linecap="round"/>
    <line x1="296" y1="416" x2="344" y2="416" stroke="#2d333b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
